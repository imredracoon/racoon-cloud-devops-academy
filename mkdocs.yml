site_name: Racoon Cloud & DevOps Academy
site_description: >-
  Corso gratuito e completo, in italiano, per diventare Cloud / DevOps Engineer
  partendo da zero: lezioni, esercizi con soluzioni, laboratori riproducibili
  e simulazioni d'esame per AWS, Google Cloud, Terraform, Kubernetes e Linux.
site_url: https://imredracoon.github.io/racoon-cloud-devops-academy/
repo_url: https://github.com/imredracoon/racoon-cloud-devops-academy
repo_name: racoon-cloud-devops-academy
edit_uri: edit/main/docs/
copyright: Contenuti a cura della community di Racoon Cloud & DevOps Academy

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  icon:
    logo: material/cloud-braces
    repo: fontawesome/brands/github

extra_css:
  - assets/css/academy.css
extra_javascript:
  - assets/js/academy.js
  - assets/js/exam.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: it

