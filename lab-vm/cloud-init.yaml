#cloud-config
# VM di laboratorio per la Fase 1 e per la preparazione LFCS.
# Uso (vedi docs/ambiente/vm-linux.md):
#   multipass launch 24.04 --name lab --cpus 2 --memory 2G --disk 20G --cloud-init lab-vm/cloud-init.yaml
# Documentazione cloud-init: https://cloudinit.readthedocs.io/

hostname: lab
package_update: true
packages:
  - bash-completion
  - man-db
  - manpages
  - tree
  - jq
  - dnsutils
  - traceroute
  - tcpdump
  - nftables
  - lvm2
  - acl
  - git
  - curl
  - nano
  - vim

runcmd:
  # Tre dischi "finti" da 1 GB (file + loop device) per gli esercizi su partizioni e LVM.
  - mkdir -p /srv/lab-disks
  - for n in 1 2 3; do truncate -s 1G /srv/lab-disks/disk$n.img; done
  - |
    cat > /etc/systemd/system/lab-disks.service <<'UNIT'
    [Unit]
    Description=Collega i dischi di laboratorio come loop device
    DefaultDependencies=no
    Before=local-fs-pre.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/bin/sh -c 'for n in 1 2 3; do losetup -f /srv/lab-disks/disk$n.img; done'

    [Install]
    WantedBy=local-fs-pre.target
    UNIT
  - systemctl daemon-reload
  - systemctl enable --now lab-disks.service

final_message: "VM di laboratorio pronta dopo $UPTIME secondi."
