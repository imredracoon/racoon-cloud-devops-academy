# Profilo cloud-init della VM "rhel-lab" (AlmaLinux 10, compatibile con RHEL 10).
# Lo script academy-vm aggiunge in testa nome host, chiave SSH e password della console.
# Uso: ./academy-vm crea rhel-lab       (vedi docs/ambiente/vm-linux.md)

package_update: true
packages:
  - bash-completion
  - man-pages
  - tree
  - jq
  - bind-utils
  - traceroute
  - tcpdump
  - lvm2
  - xfsprogs
  - acl
  - git
  - curl
  - nano
  - vim-enhanced
  - firewalld
  - policycoreutils-python-utils
  - setroubleshoot-server

runcmd:
  # firewalld attivo come su un server RHEL appena installato (lezione 1.11)
  - systemctl enable --now firewalld
  # Tre dischi "finti" da 1 GB (file + loop device) per gli esercizi su partizioni e LVM, come nella VM Ubuntu.
  - mkdir -p /srv/lab-disks
  - for n in 1 2 3; do truncate -s 1G /srv/lab-disks/disk$n.img; done
  - |
    cat > /etc/systemd/system/lab-disks.service <<'UNIT'
    [Unit]
    Description=Collega i dischi di laboratorio come loop device
    DefaultDependencies=no
    Before=local-fs-pre.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/bin/sh -c 'for n in 1 2 3; do losetup -fP /srv/lab-disks/disk$n.img; done'

    [Install]
    WantedBy=local-fs-pre.target
    UNIT
  - systemctl daemon-reload
  - systemctl enable --now lab-disks.service

final_message: "VM rhel-lab pronta dopo $UPTIME secondi."
