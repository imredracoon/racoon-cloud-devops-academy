# Ambiente "prod" del laboratorio: immagine dal registry con tag preciso, più repliche.
# La password del database arriva da un Secret creato fuori da Git (lezione 8.6).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../rotta
images:
  - name: tasks-api
    newName: ghcr.io/TUO-UTENTE/tasks-api
    newTag: "1.0.0"
configMapGenerator:
  - name: tasks-api
    namespace: tasks
    behavior: merge
    literals:
      - AMBIENTE=prod
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: tasks-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: tasks-api
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
