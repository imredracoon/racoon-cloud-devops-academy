# Overlay usato da Argo CD (progetto della Fase 8). Nessun segreto in Git:
# il Secret "tasks-db" si crea una volta a mano (o con un gestore di segreti, lezione 8.6).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../rotta
configMapGenerator:
  - name: tasks-api
    namespace: tasks
    behavior: merge
    literals:
      - AMBIENTE=gitops
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: tasks-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
