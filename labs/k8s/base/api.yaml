apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasks-api
automountServiceAccountToken: false # l'API non parla con Kubernetes: niente token nel pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  labels:
    app.kubernetes.io/name: tasks-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks-api
        app.kubernetes.io/part-of: tasks
    spec:
      serviceAccountName: tasks-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # l'utente "app" creato nel Dockerfile
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tasks-api
      containers:
        - name: api
          image: tasks-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tasks-api
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasks-db
                  key: password
            # $(VAR) usa una variabile definita prima nello stesso elenco
            - name: DATABASE_URL
              value: postgresql+psycopg://tasks:$(POSTGRES_PASSWORD)@postgres:5432/tasks
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe: # il processo risponde? Non dipende dal database
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe: # pronto a ricevere traffico? Controlla anche il database
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # Gunicorn e le metriche multiprocesso scrivono in /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-api
  labels:
    app.kubernetes.io/name: tasks-api
spec:
  selector:
    app.kubernetes.io/name: tasks-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tasks-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
