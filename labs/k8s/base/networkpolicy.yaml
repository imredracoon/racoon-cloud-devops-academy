# Prima si nega tutto il traffico in ingresso nel namespace, poi si apre solo ciò che serve.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nega-tutto-in-ingresso
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-solo-da-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tasks-api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-da-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # i proxy di Envoy Gateway girano nel namespace envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8000
