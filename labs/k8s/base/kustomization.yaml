apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tasks
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - hpa.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: tasks-api
    literals:
      - PYTHONUNBUFFERED=1
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
