# Pubblica la Tasks API sul Gateway "academy" (lezione 8.9).
# Richiede le CRD della Gateway API: kubectl apply -k rotta
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tasks-api
spec:
  parentRefs:
    - name: academy
      namespace: envoy-gateway-system
  hostnames:
    - tasks.localhost
  rules:
    # Si pubblicano solo i percorsi dell'API: /metrics resta interno al cluster,
    # come con Nginx nella Fase 7, e dall'esterno risponde 404.
    - matches:
        - path:
            type: PathPrefix
            value: /tasks
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: tasks-api
          port: 80
