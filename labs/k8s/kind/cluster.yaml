# Cluster di laboratorio della Fase 8: un control plane e due worker.
# Avvio:  kind create cluster --config kind/cluster.yaml
# Elimina: kind delete cluster --name academy
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: academy
nodes:
  - role: control-plane
  - role: worker
    labels:
      zona: a
  - role: worker
    labels:
      zona: b
