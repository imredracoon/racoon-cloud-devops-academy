# Pipeline di integrazione continua della Tasks API (Fase 7).
# Funziona quando la cartella tasks-api è la radice di un repository GitHub.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Permessi minimi per tutti i job; chi ne ha bisogno li estende.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMMAGINE: ghcr.io/${{ github.repository }}

jobs:
  qualita:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formattazione
        run: ruff format --check .

      - name: Test
        run: pytest -v

  immagine:
    name: Build, scansione e pubblicazione
    needs: qualita
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # per pubblicare su GHCR con GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Calcola tag ed etichette
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMMAGINE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Costruisci l'immagine
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMMAGINE }}:scansione
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cerca vulnerabilità gravi
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMMAGINE:scansione"

      - name: Accedi a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
