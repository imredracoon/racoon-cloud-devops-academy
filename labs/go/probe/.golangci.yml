# Configurazione di golangci-lint (lezione G.9 del percorso Go).
version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose            # il corpo delle risposte HTTP va sempre chiuso
    - gosec                # problemi di sicurezza comuni
  exclusions:
    presets:
      # Non segnala gli errori ignorati di Close, Fprint* e simili: è la scelta
      # consapevole della maggior parte dei progetti Go.
      - std-error-handling
    rules:
      - path: _test\.go      # nei test le richieste a URL variabili sono normali
        linters: [gosec]

formatters:
  enable:
    - gofmt
